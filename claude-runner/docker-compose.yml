name: claude-runner

services:
  # Workbench 01 (NestJS + MongoDB). Needs the database sibling.
  runner:
    build: .
    env_file: .env
    environment:
      # Overrides the localhost URI in the arm's .env — process.env wins over dotenv
      MONGODB_URI: mongodb://root:example@mongodb:27017/?authSource=admin
      ARM: ${ARM:-}
      BENCH_MODEL: ${BENCH_MODEL:-}
      BENCH_THINKING: ${BENCH_THINKING:-}
      # Run provenance (dashboard "Run setup" panel). Host facts are invisible
      # inside the container, so they ride in from the invoking shell, e.g.:
      #   SWEEP_ID=wb01-v3 HOST_OS="$(sw_vers -productName) $(sw_vers -productVersion)" \
      #   DOCKER_VERSION="$(docker info --format 'Docker Engine {{.ServerVersion}}')" ...
      SWEEP_ID: ${SWEEP_ID:-}
      BENCH_PROTOCOL: ${BENCH_PROTOCOL:-}
      BENCH_ATTEMPT: ${BENCH_ATTEMPT:-}
      HOST_OS: ${HOST_OS:-}
      DOCKER_VERSION: ${DOCKER_VERSION:-}
    depends_on:
      - mongodb
    volumes:
      - ../${WORKBENCH:-workbench-01-nest-graphql-api}/${ARM:?set ARM=with-schematics or ARM=without-schematics}:/workspace
      - ../${WORKBENCH:-workbench-01-nest-graphql-api}/results:/results
      - /workspace/node_modules
      - pnpm_store:/home/agent/.pnpm-store
    ports:
      - '3000:3000'

  # Workbench 02+ (frontend, MSW — no database at all).
  runner-web:
    build: .
    env_file: .env
    environment:
      ARM: ${ARM:-}
      # compose run only forwards host vars declared here — without these the
      # model pin silently falls back to the CLI default inside the container.
      BENCH_MODEL: ${BENCH_MODEL:-}
      BENCH_THINKING: ${BENCH_THINKING:-}
      SWEEP_ID: ${SWEEP_ID:-}
      BENCH_PROTOCOL: ${BENCH_PROTOCOL:-}
      BENCH_ATTEMPT: ${BENCH_ATTEMPT:-}
      HOST_OS: ${HOST_OS:-}
      DOCKER_VERSION: ${DOCKER_VERSION:-}
    volumes:
      - ../${WORKBENCH:-workbench-02-react-admin}/${ARM:?set ARM=with-schematics or ARM=without-schematics}:/workspace
      - ../${WORKBENCH:-workbench-02-react-admin}/results:/results
      - /workspace/node_modules
      - pnpm_store:/home/agent/.pnpm-store
    ports:
      # with-schematics runs on 3010, without-schematics on 3011 — set
      # WEB_PORT accordingly when using --service-ports (arms can then
      # run in parallel without colliding).
      - '${WEB_PORT:-3010}:${WEB_PORT:-3010}'

  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    # No data volume on purpose: every `up` starts with an empty database

volumes:
  pnpm_store:
